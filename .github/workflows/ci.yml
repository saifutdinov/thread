name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
          go test -race ./...
      - name: Go lint
        # Same version as mise.toml.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  deploy-files:
    # The server builds from source with these files: keep them valid.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Shell scripts
        run: shellcheck -x scripts/*.sh
      - name: Compose file
        run: DOMAIN=chat.example.org PUBLIC_IP=203.0.113.10 PASSWORD_PEPPER=x TURN_SECRET=y docker compose -f deploy/docker-compose.yml config -q
      - name: Image builds
        run: docker build -t thread:ci .
