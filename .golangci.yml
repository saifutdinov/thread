version: "2"
linters:
  default: standard
  settings:
    errcheck:
      # Best-effort cleanup and response writes: nothing useful to do on failure.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*github.com/coder/websocket.Conn).CloseNow
        - os.Remove
